    Backup System v3.0 Architecture
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
    Restic Engine • Backrest WebUI • Enterprise Security
  </text>
  
  <!-- Main Flow Arrow Background -->
  <path d="M 100 250 L 800 250" stroke="#21262d" stroke-width="40" stroke-linecap="round"/>
  <path d="M 100 250 L 800 250" stroke="#30363d" stroke-width="38" stroke-linecap="round" stroke-dasharray="2,6"/>
  
  <!-- SOURCES -->
  <g>
    <rect x="30" y="130" width="140" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="30" y="130" width="140" height="32" rx="8" fill="url(#blue)"/>
    <text x="100" y="152" text-anchor="middle" fill="#fff" font-family="'Segoe UI', Arial" font-size="12" font-weight="600">SOURCES</text>
    
    <g font-family="'Segoe UI', Arial" font-size="10" fill="#c9d1d9">
      <rect x="42" y="175" width="116" height="24" rx="4" fill="#21262d"/>
      <text x="100" y="191" text-anchor="middle">🖥️ Windows CIFS</text>
      
      <rect x="42" y="207" width="116" height="24" rx="4" fill="#21262d"/>
      <text x="100" y="223" text-anchor="middle">🐧 Linux NFS</text>
      
      <rect x="42" y="239" width="116" height="24" rx="4" fill="#21262d"/>
      <text x="100" y="255" text-anchor="middle">📁 Local Dirs</text>
      
      <rect x="42" y="271" width="116" height="24" rx="4" fill="#21262d"/>
      <text x="100" y="287" text-anchor="middle">☁️ S3 Sync</text>
      
      <rect x="42" y="303" width="116" height="24" rx="4" fill="#21262d"/>
      <text x="100" y="319" text-anchor="middle">🔌 Custom</text>
      
      <text x="100" y="355" text-anchor="middle" fill="#8b949e" font-size="9">Mount read-only</text>
    </g>
  </g>
  
  <!-- Arrow 1 -->
  <g>
    <path d="M 170 250 L 205 250" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <polygon points="205,245 215,250 205,255" fill="#58a6ff"/>
  </g>
  
  <!-- SECURITY -->
