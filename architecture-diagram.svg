      <text x="470" y="228" text-anchor="middle">✓ AES-256-CTR</text>
      <text x="470" y="246" text-anchor="middle">✓ Poly1305-AES MAC</text>
      <text x="470" y="264" text-anchor="middle">✓ Incremental Forever</text>
      <text x="470" y="282" text-anchor="middle">✓ Snapshot Immutable</text>
