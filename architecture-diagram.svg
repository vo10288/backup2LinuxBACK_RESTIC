      <text x="830" y="246" text-anchor="middle">Browse</text>
      <text x="830" y="264" text-anchor="middle">Restore</text>
      <text x="830" y="282" text-anchor="middle">Diff</text>
      <text x="830" y="305" text-anchor="middle" fill="#8b949e" font-size="8">:9898</text>
    </g>
