    <rect x="30" y="450" width="840" height="35" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="130" y="472" text-anchor="middle" fill="#3fb950" font-family="'Segoe UI', Arial" font-size="11" font-weight="600">💾 60-80% Savings</text>
    <text x="310" y="472" text-anchor="middle" fill="#58a6ff" font-family="'Segoe UI', Arial" font-size="11" font-weight="600">🔒 AES-256</text>
    <text x="470" y="472" text-anchor="middle" fill="#a371f7" font-family="'Segoe UI', Arial" font-size="11" font-weight="600">♾️ Unlimited Versions</text>
    <text x="640" y="472" text-anchor="middle" fill="#f85149" font-family="'Segoe UI', Arial" font-size="11" font-weight="600">🛡️ Ransomware Shield</text>
    <text x="800" y="472" text-anchor="middle" fill="#f0883e" font-family="'Segoe UI', Arial" font-size="11" font-weight="600">🌐 Multi-Cloud</text>
  </g>
</svg>