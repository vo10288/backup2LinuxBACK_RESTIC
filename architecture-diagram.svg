    <text x="690" y="408" text-anchor="middle" fill="#c9d1d9" font-family="'Segoe UI', Arial" font-size="10" font-weight="600">🔔 Notifications</text>
    <text x="690" y="425" text-anchor="middle" fill="#8b949e" font-family="'Segoe UI', Arial" font-size="9">Email • Slack • Discord • Webhook</text>
  </g>
  
  <!-- Retention branch -->
  <g>
    <path d="M 470 160 L 470 100 L 600 100" stroke="#30363d" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
    <rect x="600" y="75" width="180" height="50" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="690" y="98" text-anchor="middle" fill="#c9d1d9" font-family="'Segoe UI', Arial" font-size="10" font-weight="600">📅 Retention Policy</text>
    <text x="690" y="115" text-anchor="middle" fill="#8b949e" font-family="'Segoe UI', Arial" font-size="9">Daily • Weekly • Monthly • Yearly</text>
  </g>
  
  <!-- Stats bar -->
