      <rect x="602" y="287" width="116" height="22" rx="4" fill="#21262d"/>
      <text x="660" y="302" text-anchor="middle" fill="#a371f7">🔒 SFTP</text>
      
      <rect x="602" y="315" width="116" height="22" rx="4" fill="#21262d"/>
      <text x="660" y="330" text-anchor="middle" fill="#8b949e">📁 Local/NAS</text>
      
      <text x="660" y="358" text-anchor="middle" fill="#8b949e" font-size="8">Encrypted at rest</text>
    </g>
  </g>
  
  <!-- Arrow 4 -->
