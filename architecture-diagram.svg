      <text x="285" y="248" text-anchor="middle">Ransomware Check</text>
      <text x="285" y="266" text-anchor="middle" fill="#8b949e">Path Validation</text>
      <text x="285" y="284" text-anchor="middle" fill="#8b949e">Input Sanitization</text>
      <text x="285" y="302" text-anchor="middle" fill="#8b949e">No Shell Injection</text>
    </g>
  </g>
  
  <!-- Arrow 2 -->
